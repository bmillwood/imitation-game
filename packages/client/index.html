<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Client</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      margin-right: 0.5rem;
      cursor: pointer;
    }
    #log {
      background: #f5f5f5;
      padding: 1rem;
      margin-top: 1rem;
      white-space: pre-wrap;
      font-family: monospace;
      max-height: 400px;
      overflow-y: auto;
    }
    .status {
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <h1>Chat Client</h1>
  
  <div class="status">
    Status: <strong id="status">Disconnected</strong>
  </div>
  
  <div>
    <button id="connect">Connect</button>
    <button id="ping">Send Ping</button>
  </div>
  
  <div id="log">Message log will appear here...</div>
  
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
