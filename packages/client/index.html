<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Client</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40em;
        margin: 2em auto;
        padding: 0 1em;
      }
      button {
        padding: 0.5em 1em;
        margin: 0.5em;
        cursor: pointer;
      }
      input#name {
        margin: 0.5em;
      }
      #chat, #predict {
        background: #f5f5f5;
        padding: 1em;
        margin-top: 1em;
        white-space: pre-wrap;
        font-family: monospace;
        overflow-y: auto;
      }
      #chat {
        height: 20em;
      }
    </style>
  </head>
  <body>
    <h1>Chat Client</h1>

    <form id="settings">Name: <input type="text" name="name" /></form>

    <div>
      <button id="connect">Connect</button>
    </div>

    <div id="chat"></div>

    <form id="setChat">
      <input type="text" name="chat" /><input
        type="submit"
        id="sendChat"
        value="Chat"
      />
    </form>

    <div id="predict"></div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
